services:
  nest-app:
    build:
      context: ./
      dockerfile: ./Dockerfile
    depends_on:
      - mysql-container
      - redis-container
    ports:
      - "9999:3000"

  mysql-container:
    image: mysql
    ports:
      - "3306:3306"
    volumes:
      - C:\Users\wanpan\Desktop\workSpace\docker\mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: public
      MYSQL_ROOT_PASSWORD: wanpan

  redis-container:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - C:\Users\wanpan\Desktop\workSpace\docker\redis:/data
